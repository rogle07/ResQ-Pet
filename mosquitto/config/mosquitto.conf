# PetGuardian MQTT broker config (Mosquitto)
#
# Defaults to allowing anonymous connections so `docker-compose up` works
# out of the box for local development and diploma-project demos. This is
# NOT safe for a real deployment reachable from the internet - see the
# "Securing MQTT" section in DEPLOYMENT.md before going further than a
# local network or a private VPC.
#
# To lock it down:
#   1. docker exec -it petguardian-mosquitto mosquitto_passwd -c /mosquitto/config/passwd petguardian
#      (prompts for a password - use the same value as MQTT_PASSWORD in
#      backend/.env and firmware/include/config.h)
#   2. Comment out "allow_anonymous true" below and uncomment the two
#      lines under "Password-protected (production)".

listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# ---- Local development (default) ----
allow_anonymous true

# ---- Password-protected (production) ----
# allow_anonymous false
# password_file /mosquitto/config/passwd
