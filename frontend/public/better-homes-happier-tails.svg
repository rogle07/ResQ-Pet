    <path d="M119 56 L125 55 M119 58 L124 60"/>
    <!-- Cat body -->
    <path d="M97 71 C95 78 94 86 94 95 L100 95 C101 89 103 83 105 77 C107 83 109 89 110 95 L116 95 C116 87 117 78 117 71"/>
