  <!-- Typography -->
  <text x="80" y="116" font-family="'Caveat', 'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="700" fill="#2d6a4f" text-anchor="middle" font-style="italic">Better Homes</text>
  <text x="80" y="132" font-family="'Caveat', 'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="700" fill="#2d6a4f" text-anchor="middle" font-style="italic">Happier Tails ♡</text>
