    <path d="M96 46 L91 35 L102 40 C106 39 112 39 116 40 L127 35 L122 46 C125 50 126 55 125 60 C123 68 116 73 109 73 C102 73 95 68 93 60 C92 55 93 50 96 46 Z" fill="#ffffff"/>
