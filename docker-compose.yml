version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: petguardian-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: petguardian-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    build:
      context: ./backend
    container_name: petguardian-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      # Override host-specific values so containers reach each other by
      # service name rather than localhost, regardless of what's in .env.
      MONGO_URI: mongodb://mongodb:27017/petguardian
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    ports:
      - '5000:5000'
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
    container_name: petguardian-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  mongodb_data:
  backend_logs:
