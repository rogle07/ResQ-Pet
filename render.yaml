##############################################################################
# render.yaml – ResQPet Backend Service Definition
# Ref: https://render.com/docs/blueprint-spec
#
# This file describes the production deployment on Render.
# DO NOT commit real secret values here — configure them in the Render
# dashboard under Environment > Secret Files / Environment Variables.
##############################################################################

services:
  - type: web
    name: resq-pet
    runtime: node
    region: oregon          # us-west-2 — change to 'frankfurt' or 'singapore' as needed
    plan: free              # upgrade to 'starter' for always-on (no cold starts)
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health

    # Scaling (Render starter+ only)
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3
    #   targetMemoryPercent: 80
    #   targetCPUPercent: 70

    envVars:
      # ---- Server ----
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000           # Render injects $PORT; this is a fallback hint only

      # ---- Client (CORS + email links) ----
      - key: CLIENT_URL
        value: https://res-q-pet-51cc.vercel.app

      # ---- Database ----
      - key: MONGO_URI
        sync: false            # Set in Render dashboard — never commit the real URI

      # ---- JWT ----
      - key: JWT_SECRET
        sync: false            # Generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # ---- Google OAuth ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ---- Cloudinary (image uploads) ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- Email (SMTP) ----
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "ResQPet <no-reply@resqpet.app>"

      # ---- Stripe (payments) ----
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ---- IoT legacy shared key (kept for backward compat; real auth is per-device) ----
      - key: IOT_DEVICE_KEY
        sync: false

      # ---- Rate limiting ----
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"

